# Site Netlify du Dashboard Admin.
# Le répertoire de base du site doit être réglé sur `apps/admin` dans Netlify :
# c'est ce qui fait lire ce fichier. La commande remonte ensuite à la racine du
# dépôt, où vivent les workspaces npm et le fichier de verrouillage.

[build]
  command = "cd ../.. && npm ci && npm run build -w @kolek/admin"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Le dashboard n'a aucune raison d'être indexé ni encadré.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
