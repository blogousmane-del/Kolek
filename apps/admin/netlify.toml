# Site Netlify du Dashboard Admin.
#
# Le répertoire `apps/admin` est réglé dans Netlify : c'est ce qui fait lire ce
# fichier plutôt qu'un autre. Mais attention à ce qu'il ne fait PAS — Netlify le
# traite comme un *packagePath* et lance la construction depuis la racine du
# dépôt, pas depuis lui. Le journal du 2026-08-18 le dit noir sur blanc :
#
#   Current directory  /opt/build/repo
#   Config file        /opt/build/repo/apps/admin/netlify.toml
#
# **Tous les chemins ci-dessous se résolvent donc depuis la racine du dépôt.**
# La première version de ce fichier faisait `cd ../..` en tête de commande, en
# supposant l'inverse : la construction sortait du dépôt et `npm ci` échouait
# sur un `package-lock.json` introuvable, alors qu'il est bien versionné. Et
# `publish = "dist"` désignait un `dist` à la racine, qui n'existe pas.

[build]
  command = "npm ci && npm run build -w @kolek/admin"
  publish = "apps/admin/dist"
  # Voir la note longue dans le netlify.toml du collecteur : sans cette ligne,
  # une correction dans `packages/` ne reconstruit pas ce site.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/admin packages"

[build.environment]
  NODE_VERSION = "26"

# L'ancienne adresse cesse de servir. Voir la note longue dans le netlify.toml
# du site public : poser le domaine principal chez Netlify ne suffit pas, seuls
# les alias de domaine redirigent d'eux-mêmes. Deux adresses qui servent la même
# application, ce sont deux origines — et les listes CORS n'en nomment qu'une.
#
# Elle précède la réécriture SPA : Netlify applique la première correspondance,
# et `/*` avalerait tout.
[[redirects]]
  from = "https://kolek-admin.netlify.app/*"
  to = "https://admin.kolek.cash/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Le dashboard n'a aucune raison d'être indexé ni encadré.
#
# `style-src` accepte l'inline pour la même raison que côté collecteur : la
# largeur des jauges d'avancement vaut un pourcentage venu de la donnée, que
# Tailwind ne peut pas connaître au build. Le thème, lui, est désormais une
# feuille statique servie depuis l'origine.
#
# `connect-src` nomme le projet `kolek-prod` et lui seul — voir la note plus
# longue dans le netlify.toml du collecteur.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://yfnwmokxkznejotgpfgf.supabase.co wss://yfnwmokxkznejotgpfgf.supabase.co; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
