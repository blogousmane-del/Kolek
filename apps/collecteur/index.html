<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      `viewport-fit=cover` : sans lui, `env(safe-area-inset-*)` vaut zéro sur
      tous les appareils, et les marges d'encoche calculées dans la feuille de
      style ne s'appliquent jamais. C'est la moitié serveur du réglage.

      `maximum-scale` reste absent volontairement : le bloquer empêcherait un
      collecteur presbyte d'agrandir un montant, ce qui coûte plus cher qu'un
      zoom accidentel.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- La teinte de la barre système sur Android et en mode installé : la même
         que l'en-tête sombre, sinon une bande blanche le surmonte. -->
    <meta name="theme-color" content="#0E2E1F" />
    <title>Kolek — Collecteur</title>
  </head>
  <body>
    <!--
      Repli statique. React le remplace dès qu'il monte. S'il ne monte pas — un
      module qui lève au chargement, par exemple une configuration Supabase
      absente — ce message reste, à la place d'un écran blanc muet. Le filet
      React ne couvre pas ce cas : il n'existe qu'une fois React démarré.
    -->
    <div id="root">
      <div
        style="
          font-family: system-ui, sans-serif;
          max-width: 360px;
          margin: 15vh auto;
          padding: 0 20px;
          color: #171a17;
        "
      >
        <h1 style="font-size: 16px">Kolek ne démarre pas</h1>
        <p style="color: #6c716a">
          L’application n’a pas pu se charger. Vérifie ta connexion et recharge la page. Si le
          problème persiste, préviens ton contact GTCS.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
