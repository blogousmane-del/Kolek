<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      `viewport-fit=cover` : sans lui, `env(safe-area-inset-*)` vaut zéro sur
      tous les appareils, et les marges d'encoche calculées dans la feuille de
      style ne s'appliquent jamais. C'est la moitié serveur du réglage.

      `maximum-scale` reste absent volontairement : le bloquer empêcherait un
      collecteur presbyte d'agrandir un montant, ce qui coûte plus cher qu'un
      zoom accidentel.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0E2E1F" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Kolek — Collecteur</title>
    <!--
      La feuille de l'écran d'attente, écrite ici plutôt qu'en attributs `style`
      : une animation demande des `@keyframes`, et un attribut ne peut pas en
      porter. Elle est en ligne et non importée parce qu'elle doit peindre avant
      le premier octet de JavaScript — c'est tout son métier. Elle n'attend pas
      non plus les fontes chargées plus haut : ce texte se lit en `system-ui`,
      déjà présent, plutôt que de rester invisible le temps du réseau.

      Les valeurs sont recopiées de `packages/core/src/tokens.ts` : ce document
      est servi avant Tailwind, donc avant que `@theme` existe. La marque, elle,
      n'est pas recopiée — l'`<img>` pointe le favicon engendré par
      `scripts/generer-marque.mjs`, seule source du « k » sur or.
    -->
    <style>
      .attente {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        background: #f4f5f2;
        color: #171a17;
      }
      .attente-slogan {
        margin: 0;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: -0.01em;
        color: #666b64;
      }
      .attente-slogan strong {
        font-weight: 700;
        color: #171a17;
      }
      .attente-piste {
        position: relative;
        width: 120px;
        height: 2px;
        overflow: hidden;
        background: #e6e3da;
      }
      .attente-piste::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        background: #d2b24c;
        animation: attente-glisse 1.4s ease-in-out infinite;
      }
      @keyframes attente-glisse {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(350%);
        }
      }
      /*
        Le diagnostic ne s'affiche qu'au bout de six secondes. Un démarrage
        normal ne dure pas six secondes : React a remplacé la page bien avant,
        et personne ne lit jamais cette ligne. Passé ce délai, en revanche,
        l'attente n'en est plus une, et il faut rendre au collecteur la seule
        chose utile — quoi faire.
      */
      .attente-diagnostic {
        max-width: 340px;
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: #666b64;
        opacity: 0;
        animation: attente-aveu 400ms ease-out 6s forwards;
      }
      @keyframes attente-aveu {
        to {
          opacity: 1;
        }
      }
      /*
        Mouvement réduit : la barre cesse de courir mais continue de respirer.
        Un indicateur figé se lit comme une page morte. Le délai du diagnostic
        est conservé — c'est une temporisation, pas une animation.
      */
      @media (prefers-reduced-motion: reduce) {
        .attente-piste::after {
          width: 100%;
          animation: attente-pouls 2.4s ease-in-out infinite;
        }
        .attente-diagnostic {
          animation-duration: 1ms;
        }
        @keyframes attente-pouls {
          0%,
          100% {
            opacity: 0.35;
          }
          50% {
            opacity: 1;
          }
        }
      }
    </style>
  </head>
  <body>
    <!--
      Repli statique. React le remplace dès qu'il monte. S'il ne monte pas — un
      module qui lève au chargement, par exemple une configuration Supabase
      absente — ce repli reste, à la place d'un écran blanc muet. Le filet
      React ne couvre pas ce cas : il n'existe qu'une fois React démarré.

      C'est donc deux écrans en un : l'attente de la seconde qui suit, et la
      panne de la minute d'après. Il porte la marque d'abord, le diagnostic
      seulement quand l'attente a trop duré.
    -->
    <div id="root">
      <div class="attente">
        <img src="/favicon.svg" width="56" height="56" alt="" />
        <p class="attente-slogan"><strong>Kolek&#8239;!</strong> Ton Djè en Sécurité</p>
        <div class="attente-piste" role="progressbar" aria-label="Chargement"></div>
        <p class="attente-diagnostic">
          Toujours rien&#8239;? Vérifie ta connexion et recharge la page. Si le problème persiste,
          préviens ton contact GTCS.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
