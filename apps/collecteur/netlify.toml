# Site Netlify de l'App Collecteur.
#
# Le répertoire `apps/collecteur` est réglé dans Netlify : c'est ce qui fait lire ce
# fichier plutôt qu'un autre. Mais attention à ce qu'il ne fait PAS — Netlify le
# traite comme un *packagePath* et lance la construction depuis la racine du
# dépôt, pas depuis lui. Le journal du 2026-08-18 le dit noir sur blanc :
#
#   Current directory  /opt/build/repo
#   Config file        /opt/build/repo/apps/collecteur/netlify.toml
#
# **Tous les chemins ci-dessous se résolvent donc depuis la racine du dépôt.**
# La première version de ce fichier faisait `cd ../..` en tête de commande, en
# supposant l'inverse : la construction sortait du dépôt et `npm ci` échouait
# sur un `package-lock.json` introuvable, alors qu'il est bien versionné. Et
# `publish = "dist"` désignait un `dist` à la racine, qui n'existe pas.

[build]
  command = "npm ci && npm run build -w @kolek/collecteur"
  publish = "apps/collecteur/dist"
  # Piège de monorepo. Un répertoire de base réglé fait décider Netlify de
  # reconstruire ou non en regardant si *ce répertoire* a changé. Or cette
  # application vit surtout dans `packages/ui` et `packages/core`. Sans cette
  # ligne, une correction faite dans un paquet partagé ne déclenche rien : le
  # site reste sur l'ancienne version, et aucun signal ne le dit. Le premier
  # symptôme serait un écran corrigé en local et cassé en ligne.
  #
  # Convention Netlify : code de sortie 0 = ne pas construire. `git diff
  # --quiet` rend 0 quand rien n'a bougé — c'est exactement ce qu'on veut.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/collecteur packages"

[build.environment]
  NODE_VERSION = "26"

# Application à page unique : toute route inconnue rend l'index.
# Le code 200 et non 301 — c'est une réécriture, pas une redirection.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# `style-src` doit accepter l'inline. Ce n'est plus pour les tokens : depuis le
# passage à Tailwind, le thème est une feuille statique servie depuis l'origine.
# Il reste exactement un usage de l'attribut `style` — la largeur des jauges
# d'avancement, qui vaut un pourcentage venu de la donnée. Aucune classe ne peut
# porter une valeur inconnue au build. `script-src` reste strict : Vite n'émet
# que des scripts externes.
#
# `connect-src` nomme le projet `kolek-prod` et lui seul. Le joker
# `https://*.supabase.co` qui figurait ici laissait une application compromise
# parler à n'importe quel projet Supabase du monde. Si la référence change,
# c'est ici et dans le `netlify.toml` de l'admin qu'il faut la reporter — une
# CSP périmée se manifeste par des requêtes bloquées, pas par une alerte.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://yfnwmokxkznejotgpfgf.supabase.co wss://yfnwmokxkznejotgpfgf.supabase.co; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(), microphone=()"
    # Posé le 2026-08-18. L'audit a constaté que cette application était
    # indexable alors que le dashboard ne l'était pas : une incohérence, pas une
    # brèche — la page d'accueil est un écran de connexion. Les deux outils
    # internes se tiennent maintenant pareil. Seul `apps/site` est indexable, et
    # c'est écrit dans son propre netlify.toml.
    X-Robots-Tag = "noindex, nofollow"

# Le service worker ne doit jamais être servi depuis un cache : c'est lui qui
# porte les mises à jour de l'application. Un sw.js périmé fige la version
# installée sur le téléphone du collecteur.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Les fichiers d'assets portent une empreinte dans leur nom : ils sont
# immuables et peuvent être mis en cache indéfiniment.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
