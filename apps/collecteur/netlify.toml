# Site Netlify de l'App Collecteur.
# Le répertoire de base du site doit être réglé sur `apps/collecteur` dans
# Netlify : c'est ce qui fait lire ce fichier. La commande remonte ensuite à la
# racine du dépôt, où vivent les workspaces npm et le fichier de verrouillage.

[build]
  command = "cd ../.. && npm ci && npm run build -w @kolek/collecteur"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26"

# Application à page unique : toute route inconnue rend l'index.
# Le code 200 et non 301 — c'est une réécriture, pas une redirection.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# `style-src` doit accepter l'inline. Ce n'est plus pour les tokens : depuis le
# passage à Tailwind, le thème est une feuille statique servie depuis l'origine.
# Il reste exactement un usage de l'attribut `style` — la largeur des jauges
# d'avancement, qui vaut un pourcentage venu de la donnée. Aucune classe ne peut
# porter une valeur inconnue au build. `script-src` reste strict : Vite n'émet
# que des scripts externes.
#
# `connect-src` nomme le projet `kolek-prod` et lui seul. Le joker
# `https://*.supabase.co` qui figurait ici laissait une application compromise
# parler à n'importe quel projet Supabase du monde. Si la référence change,
# c'est ici et dans le `netlify.toml` de l'admin qu'il faut la reporter — une
# CSP périmée se manifeste par des requêtes bloquées, pas par une alerte.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://yfnwmokxkznejotgpfgf.supabase.co wss://yfnwmokxkznejotgpfgf.supabase.co; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(), microphone=()"

# Le service worker ne doit jamais être servi depuis un cache : c'est lui qui
# porte les mises à jour de l'application. Un sw.js périmé fige la version
# installée sur le téléphone du collecteur.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Les fichiers d'assets portent une empreinte dans leur nom : ils sont
# immuables et peuvent être mis en cache indéfiniment.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
