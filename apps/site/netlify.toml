# Site public Kolek — page de tarifs.
#
# Le répertoire `apps/site` est réglé dans Netlify : c'est ce qui fait lire ce
# fichier plutôt qu'un autre. Mais attention à ce qu'il ne fait PAS — Netlify le
# traite comme un *packagePath* et lance la construction depuis la racine du
# dépôt, pas depuis lui. Le journal du 2026-08-18 le dit noir sur blanc :
#
#   Current directory  /opt/build/repo
#   Config file        /opt/build/repo/apps/site/netlify.toml
#
# **Tous les chemins ci-dessous se résolvent donc depuis la racine du dépôt.**
# La première version de ce fichier faisait `cd ../..` en tête de commande, en
# supposant l'inverse : la construction sortait du dépôt et `npm ci` échouait
# sur un `package-lock.json` introuvable, alors qu'il est bien versionné. Et
# `publish = "dist"` désignait un `dist` à la racine, qui n'existe pas.

[build]
  command = "npm ci && npm run build -w @kolek/site"
  publish = "apps/site/dist"
  # Voir la note longue dans le netlify.toml du collecteur : sans cette ligne,
  # une correction dans `packages/` ne reconstruit pas ce site.
  #
  # **Et chaque script que la construction exécute doit y figurer.** Depuis le
  # 2026-10-02, la liste nomme les trois que la construction de ce site lit
  # hors de `apps/site` : `garde-env.mjs` et `decouper-lib.mjs`, importés par
  # `vite.config.ts`, et `prerendre.mjs`, lancé après `vite build` pour écrire
  # une page HTML par route. Avant, aucun n'y était : une correction du seul
  # `prerendre.mjs` — une balise canonique mal posée, par exemple — aurait été
  # validée, fusionnée, et jamais construite. Netlify aurait continué de servir
  # l'ancienne page en annonçant un déploiement « ignoré », ce qu'on ne lit pas.
  #
  # Nommés un par un plutôt que `scripts` en entier : ce répertoire porte une
  # trentaine de contrôles qui ne touchent pas au site, et chacun déclencherait
  # une reconstruction pour rien. Un script ajouté à la construction s'ajoute
  # ici.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/site packages scripts/garde-env.mjs scripts/decouper-lib.mjs scripts/prerendre.mjs"

[build.environment]
  NODE_VERSION = "26"

# L'ancienne adresse cesse de servir.
#
# **Poser le domaine principal chez Netlify ne suffit pas** — constaté le
# 2026-08-27, une heure après la bascule. Un *alias* de domaine, lui, redirige
# tout seul : `www.kolek.cash` a rendu un 301 dès l'émission du certificat. Mais
# `kolek-site.netlify.app` a continué de servir la page en 200, indéfiniment.
#
# Ce n'est pas cosmétique. Deux adresses qui servent la même application, ce
# sont **deux origines** — et les listes CORS des Edge Functions n'en nomment
# qu'une. Le formulaire d'ouverture de compte marcherait depuis l'une et pas
# depuis l'autre, selon le lien par lequel le visiteur est arrivé. Côté
# référencement, c'est aussi la page dédoublée que la balise canonique existe
# pour éviter.
#
# `force = true` est indispensable : sans lui, la règle s'efface devant un
# fichier réellement présent à ce chemin, et la racine en est un.
#
# **Cette règle précède les quatre routes nommées ci-dessous**, et l'ordre
# fait la décision : Netlify applique la première correspondance. Une règle
# comme `/inscription` n'est bornée à aucun hôte — elle correspondrait tout
# autant à `kolek-site.netlify.app/inscription` — et la placer avant ferait
# manquer la redirection vers le nouveau domaine pour ces quatre chemins.
[[redirects]]
  from = "https://kolek-site.netlify.app/*"
  to = "https://kolek.cash/:splat"
  status = 301
  force = true

# Le vrai 404 — tâche 6 de l'audit du 2026-09-04, point A.3.
#
# Avant cette ligne, `/*` réécrivait toute adresse vers `/index.html` en
# **200** : une adresse inventée rendait la page d'accueil sous un statut
# « tout va bien ». Une mention légale mal orthographiée dans un lien partagé
# se serait donc rendue introuvable... en semblant exister.
#
# Sans joker, Netlify sert `apps/site/public/404.html` — copié tel quel dans
# `dist/404.html` par Vite — avec le statut 404, pour toute adresse qui ne
# correspond ni à un fichier réel (`/`, `/assets/*`, `/robots.txt`, …) ni à
# l'une des règles ci-dessous. Rien à faire pour la racine ou pour les
# ressources : Netlify les sert directement, avant même d'essayer une règle.
#
# **Chaque règle vise le fichier de sa route, et non plus `/index.html`.**
# Depuis le 2026-09-20, `scripts/prerendre.mjs` écrit une page par route —
# `dist/conditions/index.html` porte le texte des conditions, son titre et sa
# propre balise canonique. Réécrire vers `/index.html` servirait de nouveau à
# tout le monde la page d'accueil, c'est-à-dire précisément le défaut que le
# prérendu vient de fermer : 14 mots indexables et une canonique unique pour
# cinq adresses.
#
# La cible est nommée plutôt que laissée aux « jolies adresses » de Netlify,
# qui servirait `conditions/index.html` toute seule : une règle explicite se
# lit, et `scripts/verifier-routes.mjs` peut la comparer à la table.
#
# La liste de référence des routes est `apps/site/src/vitrine/routes.ts`, qui
# porte aussi le titre, la description et l'indexabilité de chacune. Une route
# ajoutée là-bas sans sa règle ici marche en développement — Vite sert tout —
# et rend 404 en production, sans qu'aucune épreuve du site ne le remarque :
# rien, dans `npm test`, ne visite ce fichier.
# `scripts/verifier-routes.mjs` (`npm run verifier:routes`) lit la table et ce
# fichier, et échoue si l'un contient une route que l'autre ignore, si une
# règle vise le mauvais fichier, ou si ce joker reparaît.
#
# La barre oblique finale n'a pas besoin de sa propre règle : Netlify
# normalise les adresses avant de tester les règles de réécriture internes
# (`status = 200`, sur ce même site) et fait donc correspondre `/conditions`
# et `/conditions/` à la même règle — documenté sous « Trailing slash » dans
# les options de redirection Netlify. Seule une réécriture en *proxy* vers un
# autre site échapperait à cette normalisation ; ce n'est pas le cas ici.
[[redirects]]
  from = "/inscription"
  to = "/inscription/index.html"
  status = 200

[[redirects]]
  from = "/mentions-legales"
  to = "/mentions-legales/index.html"
  status = 200

[[redirects]]
  from = "/conditions"
  to = "/conditions/index.html"
  status = 200

[[redirects]]
  from = "/confidentialite"
  to = "/confidentialite/index.html"
  status = 200

# Contrairement aux deux applications, ce site a vocation à être indexé : c'est
# la surface commerciale. Pas de `X-Robots-Tag: noindex` ici.
#
# `connect-src` s'ouvre sur Supabase depuis le 2026-08-23, et sur rien d'autre.
#
# Jusque-là cette page n'émettait aucune requête et la directive disait
# `'self'`. Le formulaire d'ouverture de compte en émet une : un POST vers
# l'Edge Function `demander-ouverture`. L'origine est nommée exactement — pas de
# joker, pas de `*.supabase.co`, qui autoriserait le projet Supabase de
# n'importe qui.
#
# Ce que cette ouverture concède, précisément : la page peut désormais parler à
# ce projet-là. Elle n'y gagne aucun droit — la clé anonyme qu'elle porte se
# voit refuser les neuf tables, et la fonction appelée valide, borne et
# n'accuse réception de rien de ce qu'elle écrit.
#
# `form-action 'none'` reste : le formulaire est envoyé par `fetch`, jamais par
# une soumission de navigateur. La directive continue donc d'interdire qu'une
# page injectée poste vers un tiers.
#
# `style-src` accepte l'inline pour la même raison que dans les applications :
# le repli statique de `index.html` porte ses styles en attribut.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://yfnwmokxkznejotgpfgf.supabase.co; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"

# Le formulaire d'ouverture de compte reste hors de l'index.
#
# Depuis le prérendu (2026-09-20), `/inscription` a son propre fichier,
# `inscription/index.html`, et ce fichier porte déjà
# `<meta name="robots" content="noindex">` dans le HTML servi :
# `scripts/prerendre.mjs` l'y écrit pour toute route que `routes.ts` déclare
# non indexable. Cet en-tête la double, et les deux ne tombent pas ensemble :
# la balise vit dans un gabarit qu'on remanie, l'en-tête vit ici.
#
# Jusqu'à cette date, la page était servie par le même `index.html` que la
# vitrine, et cet en-tête était sa seule protection : un `noindex` posé par
# JavaScript arrive après le passage du robot.
#
# Rien à cacher ici : la page est publique et le restera. Ce qu'on évite, c'est
# qu'une recherche « Kolek » tombe sur un formulaire vide au lieu de la page qui
# explique le produit.
[[headers]]
  for = "/inscription"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
