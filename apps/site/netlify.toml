# Site public Kolek — page de tarifs.
#
# Le répertoire `apps/site` est réglé dans Netlify : c'est ce qui fait lire ce
# fichier plutôt qu'un autre. Mais attention à ce qu'il ne fait PAS — Netlify le
# traite comme un *packagePath* et lance la construction depuis la racine du
# dépôt, pas depuis lui. Le journal du 2026-08-18 le dit noir sur blanc :
#
#   Current directory  /opt/build/repo
#   Config file        /opt/build/repo/apps/site/netlify.toml
#
# **Tous les chemins ci-dessous se résolvent donc depuis la racine du dépôt.**
# La première version de ce fichier faisait `cd ../..` en tête de commande, en
# supposant l'inverse : la construction sortait du dépôt et `npm ci` échouait
# sur un `package-lock.json` introuvable, alors qu'il est bien versionné. Et
# `publish = "dist"` désignait un `dist` à la racine, qui n'existe pas.

[build]
  command = "npm ci && npm run build -w @kolek/site"
  publish = "apps/site/dist"
  # Voir la note longue dans le netlify.toml du collecteur : sans cette ligne,
  # une correction dans `packages/` ne reconstruit pas ce site.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/site packages"

[build.environment]
  NODE_VERSION = "26"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Contrairement aux deux applications, ce site a vocation à être indexé : c'est
# la surface commerciale. Pas de `X-Robots-Tag: noindex` ici.
#
# `connect-src` s'ouvre sur Supabase depuis le 2026-08-23, et sur rien d'autre.
#
# Jusque-là cette page n'émettait aucune requête et la directive disait
# `'self'`. Le formulaire d'ouverture de compte en émet une : un POST vers
# l'Edge Function `demander-ouverture`. L'origine est nommée exactement — pas de
# joker, pas de `*.supabase.co`, qui autoriserait le projet Supabase de
# n'importe qui.
#
# Ce que cette ouverture concède, précisément : la page peut désormais parler à
# ce projet-là. Elle n'y gagne aucun droit — la clé anonyme qu'elle porte se
# voit refuser les neuf tables, et la fonction appelée valide, borne et
# n'accuse réception de rien de ce qu'elle écrit.
#
# `form-action 'none'` reste : le formulaire est envoyé par `fetch`, jamais par
# une soumission de navigateur. La directive continue donc d'interdire qu'une
# page injectée poste vers un tiers.
#
# `style-src` accepte l'inline pour la même raison que dans les applications :
# le repli statique de `index.html` porte ses styles en attribut.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://yfnwmokxkznejotgpfgf.supabase.co; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
