<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kolek · Application de tontine et collecte journalière</title>
    <meta
      name="description"
      content="Le carnet du banquier ambulant et du tontinier, sur téléphone : chaque mise comptée, chaque caisse rapprochée. Pour les collecteurs d’Abidjan, Côte d’Ivoire."
    />
    <meta name="theme-color" content="#06140E" />

    <!--
      L'adresse canonique.

      Le site répond sur cinq chemins — `/`, `/inscription`, `/mentions-legales`,
      `/conditions` et `/confidentialite`, voir `App.tsx` — et `index.html` les sert
      tous par la réécriture du `netlify.toml`. Sans cette ligne, Google verrait
      plusieurs pages au même contenu HTML initial et choisirait lui-même laquelle
      garder.

      **Ce fichier est le gabarit, plus la seule page servie.** Depuis le
      2026-09-20, `scripts/prerendre.mjs` le lit après `vite build` et en tire une
      page par route — `dist/conditions/index.html` et les autres — dont il
      remplace le titre, la description, cette balise canonique et les `og:*` par
      les valeurs de `apps/site/src/vitrine/routes.ts`.

      La valeur écrite ici est donc celle de la racine, et elle est juste : c'est
      la racine que sert `dist/index.html`. Les autres routes reçoivent la leur à
      la construction.

      Jusqu'à cette date, les cinq routes servaient ce fichier tel quel. Les trois
      pages juridiques déclaraient donc la racine comme leur propre version
      canonique, l'inverse de ce que le sitemap déclarait, et un aperçu WhatsApp de
      `/conditions` affichait celui de la racine. Les poser depuis React n'aurait
      réglé que la moitié du problème : le robot qui prévisualise un lien WhatsApp
      lit le HTML brut et n'exécute jamais le JavaScript, donc une valeur posée
      après le montage ne lui serait jamais parvenue.

      `scripts/prerendre.mjs` refuse d'écrire si cette balise est introuvable : un
      gabarit remanié sans elle ferait sortir cinq pages portant la canonique
      d'origine, en silence.
    -->
    <link rel="canonical" href="https://kolek.cash/" />

    <!--
      Open Graph — ce que Facebook, LinkedIn ou WhatsApp affichent quand on colle
      l'adresse. Sans ces balises, le lien voyage nu : un titre deviné dans le
      HTML, aucune vignette. Sur un produit vendu de bouche à oreille dans un
      marché, c'est le lien partagé qui fait la première impression.

      Les textes reprennent mot pour mot le `<title>` et la `<meta description>`
      ci-dessus. Deux formulations divergentes se sépareraient à la première
      retouche, et personne ne verrait laquelle est servie.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kolek" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://kolek.cash/" />
    <meta property="og:title" content="Kolek · Application de tontine et collecte journalière" />
    <meta
      property="og:description"
      content="Le carnet du banquier ambulant et du tontinier, sur téléphone : chaque mise comptée, chaque caisse rapprochée. Pour les collecteurs d’Abidjan, Côte d’Ivoire."
    />
    <!-- Engendrée par `scripts/generer-marque.mjs` depuis `tokens.ts`, comme le
         favicon : une image de marque peinte à la main diverge de la palette au
         premier changement de couleur. -->
    <meta property="og:image" content="https://kolek.cash/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="La marque Kolek : un « k » sombre sur une pièce d’or." />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      La feuille de l'écran d'attente, écrite ici plutôt qu'en attributs `style`
      : une animation demande des `@keyframes`, et un attribut ne peut pas en
      porter. Elle est en ligne et non importée parce qu'elle doit peindre avant
      le premier octet de JavaScript — c'est tout son métier, et sur la vitrine
      c'est la première image que voit quelqu'un qui ne connaît pas encore le
      produit.

      Les valeurs sont recopiées de `packages/core/src/tokens.ts` : ce document
      est servi avant Tailwind, donc avant que `@theme` existe. Le fond est
      `darkCanvas`, comme la page qui suit — la marque ne doit pas clignoter du
      clair au sombre au moment où React monte. La marque, elle, n'est pas
      recopiée : l'`<img>` pointe le favicon engendré par
      `scripts/generer-marque.mjs`, seule source du « k » sur or.
    -->
    <style>
      .attente {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        background: #06140e;
        color: #f4f5f2;
      }
      .attente-slogan {
        margin: 0;
        font-size: 17px;
        font-weight: 500;
        letter-spacing: -0.01em;
        color: rgba(244, 245, 242, 0.7);
      }
      .attente-slogan strong {
        font-weight: 700;
        color: #f4f5f2;
      }
      .attente-piste {
        position: relative;
        width: 120px;
        height: 2px;
        overflow: hidden;
        background: rgba(244, 245, 242, 0.14);
      }
      .attente-piste::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        background: #d2b24c;
        animation: attente-glisse 1.4s ease-in-out infinite;
      }
      @keyframes attente-glisse {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(350%);
        }
      }
      /*
        Le diagnostic ne s'affiche qu'au bout de six secondes. Un chargement
        normal ne dure pas six secondes : React a remplacé la page bien avant,
        et personne ne lit jamais cette ligne. Passé ce délai, en revanche,
        l'attente n'en est plus une, et il faut le dire.
      */
      .attente-diagnostic {
        max-width: 340px;
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: rgba(244, 245, 242, 0.7);
        opacity: 0;
        animation: attente-aveu 400ms ease-out 6s forwards;
      }
      @keyframes attente-aveu {
        to {
          opacity: 1;
        }
      }
      /*
        Mouvement réduit : la barre cesse de courir mais continue de respirer.
        Un indicateur figé se lit comme une page morte. Le délai du diagnostic
        est conservé — c'est une temporisation, pas une animation.
      */
      @media (prefers-reduced-motion: reduce) {
        .attente-piste::after {
          width: 100%;
          animation: attente-pouls 2.4s ease-in-out infinite;
        }
        .attente-diagnostic {
          animation-duration: 1ms;
        }
        @keyframes attente-pouls {
          0%,
          100% {
            opacity: 0.35;
          }
          50% {
            opacity: 1;
          }
        }
      }
    </style>
  </head>
  <body>
    <!--
      Repli statique. React le remplace dès qu'il monte. S'il ne monte pas, ce
      repli reste, à la place d'un écran noir muet. Le filet React ne couvre
      pas ce cas : il n'existe qu'une fois React démarré.

      C'est donc deux écrans en un : l'attente de la seconde qui suit, et la
      panne de la minute d'après. Il porte la marque d'abord, le diagnostic
      seulement quand l'attente a trop duré.
    -->
    <div id="root">
      <div class="attente">
        <img src="/favicon.svg" width="56" height="56" alt="" />
        <p class="attente-slogan"><strong>Kolek&#8239;!</strong> Ton Djè en Sécurité</p>
        <div class="attente-piste" role="progressbar" aria-label="Chargement"></div>
        <p class="attente-diagnostic">
          Toujours rien&#8239;? Vérifie ta connexion et recharge la page.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
