# Kolek — la vérification tourne sur chaque poussée, pas quand on y pense
#
# ## Le trou que ce fichier bouche
#
# Le 2026-08-29, trois correctifs de sécurité ont été versés puis déployés à la
# main : migration par `supabase db push`, fonction par `supabase functions
# deploy`. Rien, nulle part, n'aurait signalé un oubli.
#
# C'est le pire genre de défaut : **un correctif versé et non déployé est
# indiscernable d'un correctif appliqué.** Le dépôt est vert, la revue est
# faite, le commit est poussé — et la production porte encore la faille.
#
# Second trou, plus discret : `verifier:bundles` refuse un artefact contenant
# une clé de service. Il ne tournait que lorsqu'un humain lançait
# `npm run verifier`. Le jour où personne ne le lance est exactement le jour où
# il aurait servi — c'est ainsi que la clé du 2026-08-24 est partie.
#
# ## Ce qui n'est pas ici, et pourquoi
#
# `verifier:dns` et `verifier:en-ligne` interrogent la production. Les mettre
# ici les ferait échouer sur toute branche dont la construction ne correspond
# pas encore à ce qui est servi — c'est-à-dire toute branche en cours. Ils
# restent des contrôles d'après-déploiement, lancés à la main.
#
# Le déploiement automatique n'y est pas non plus : il demande
# `SUPABASE_ACCESS_TOKEN`, la référence du projet et le mot de passe de la base
# en secrets de dépôt. C'est un choix qui appartient à GTCS, pas au CI.

name: Vérification

on:
  push:
    branches: [main]
  pull_request:
  # Le redéploiement à la demande. Il existe à cause du 2026-09-09 : une branche
  # fusionnée en avance rapide a poussé dix-sept commits d'un coup, dont deux
  # touchaient des Edge Functions, et le garde-fou ci-dessous n'a regardé que le
  # dernier — qui ne touchait que `Docs/`. Rien n'a été déployé, et le job a
  # rendu « succès ».
  #
  # Le garde-fou est corrigé, mais il fallait aussi un moyen de rattraper sans
  # avoir à modifier un fichier pour la forme.
  workflow_dispatch:
    inputs:
      deployer_fonctions:
        description: Déployer les Edge Functions même si rien n'a changé
        type: boolean
        default: false

# Deux poussées rapprochées sur la même branche : seule la dernière compte.
#
# Sauf sur `main`, depuis le 2026-10-02. Chaque fusion y garde son verdict, et
# un déploiement commencé y va à son terme : la poussée suivante attend au lieu
# d'annuler. L'attente ne suffit pas à ne rien perdre : GitHub ne garde qu'une
# exécution en attente par groupe, et une troisième poussée remplace la
# deuxième, qui ne tourne jamais. Les plages du job `fonctions` et du rappel
# des migrations se mesurent donc depuis le dernier run vert, et non depuis la
# poussée précédente : voir `scripts/plage-depuis-le-dernier-vert.mjs`.
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  depot:
    name: Dépôt — thème, tests, construction, fuites
    runs-on: ubuntu-latest

    # Environnement **synthétique**, et c'est délibéré. `garde-env.mjs` exige
    # une adresse de projet bien formée et une clé qui ne soit pas secrète ; il
    # accepte `sb_publishable_` sans chercher à l'authentifier. Ces deux valeurs
    # suffisent donc à construire.
    #
    # Poser ici la vraie clé publiable n'apporterait rien : le CI ne parle à
    # aucun projet. Et une valeur réelle dans un fichier de workflow d'un dépôt
    # public est une habitude dont on ne veut pas, même quand elle est publique
    # par conception — c'est le glissement qui finit par y faire entrer autre
    # chose.
    env:
      VITE_SUPABASE_URL: https://exemple-ci.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_valeur-de-ci-sans-effet

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 26 comme les trois `netlify.toml`. Une version différente ici
          # validerait une construction que la production ne fait pas.
          node-version: '26'
          cache: npm

      - run: npm ci

      # Les générateurs d'abord : ils sont rapides, et un thème désynchronisé
      # fait échouer des tests d'interface d'une manière qui envoie chercher
      # ailleurs.
      - name: Thème, marque, paliers
        run: |
          npm run verifier:theme
          npm run verifier:marque
          npm run verifier:paliers

      # Le contrôle qu'aucun test d'interface ne peut faire : jsdom n'a pas de
      # disposition, donc rien ne mesure une police. Un champ sous 16 px fait
      # zoomer Safari sur iPhone au premier toucher, et ça ne se voit que sur
      # un téléphone qu'on n'a pas sous la main au moment de la revue.
      - name: Aucun champ sous 16 px
        run: npm run verifier:champs

      # `apps/site/.env.example` a manqué du 2026-08-23 au 2026-09-09, réclamé
      # par trois audits. Pendant ce temps le README affirmait « aucun .env : le
      # site ne parle à aucune API » — alors que la vitrine poste un mot de
      # passe vers `demander-ouverture` et que `gardeEnv()` y lève dans le hook
      # `config`. Un clone neuf suivant le README à la lettre ne démarrait pas.
      #
      # Le contrôle compare l'**écart** et non la présence : exiger le fichier
      # serait vert le jour où quelqu'un ajoute une variable au code sans
      # l'ajouter à l'exemple, et ce jour-là coûte le même après-midi.
      - name: Les exemples d'environnement disent la vérité
        run: npm run verifier:exemples-env

      # Le manifeste PWA a porté `#FBFAF6` du 2026-09-04 au 2026-09-09 — le
      # jeton `paper`, supprimé le 4. L'écran de démarrage de l'application
      # installée est resté cinq jours peint dans une couleur que le Design
      # System ne connaissait plus.
      #
      # Invisible parce que cette couleur ne vit dans aucune feuille de style :
      # elle est recopiée dans `vite.config.ts` et ne réapparaît que dans un
      # artefact engendré que personne ne relit.
      - name: Le manifeste PWA suit ses jetons
        run: npm run verifier:manifeste

      # Contrôle n°6 des vingt — « autorisation côté serveur ». Il a été
      # recompté à la main dans chaque audit depuis le 18 août : « 16 fonctions
      # détiennent la clé de service, 14 vérifient leur appelant » le
      # 2026-09-04, dix-neuf toutes gardées le 2026-09-10. Ces nombres étaient
      # justes le jour de leur mesure, et le dépôt est passé de treize à
      # dix-neuf fonctions en trois semaines.
      #
      # La question n'a jamais été de savoir si elles sont gardées aujourd'hui,
      # mais si la vingtième le sera. Une fonction neuve qui n'est pas classée
      # dans la table fait échouer cette étape, et c'est le seul moment où
      # quelqu'un se pose la question au bon moment — avant la fusion.
      - name: Les Edge Functions vérifient leur appelant
        run: npm run verifier:portillons

      # Onze cadratins de prose dans les trois pages légales de cette branche
      # sont passés à travers trois tours de relecture sans qu'aucun automate
      # ne les voie — ni le CI, qui ne se déclenche pas sur une branche sans
      # pull request, ni personne qui aurait pensé à lancer `verifier:tirets`
      # à la main. Ils n'ont été trouvés qu'une fois `test:scripts` lancé
      # localement, par curiosité, bien après les relectures. Mesuré : 11
      # cadratins, dans `Confidentialite.tsx` et `MentionsLegales.tsx`.
      - name: Aucun cadratin de prose dans l'interface
        run: npm run verifier:tirets

      # L'adresse personnelle de l'exploitant est réapparue plusieurs fois
      # dans l'historique de ce dépôt — un copier-coller d'un ancien
      # `liens.ts`, une branche partie avant la correction — et un numéro
      # ARTCI inventé serait la même faute dans un texte juridique plutôt que
      # dans un lien `mailto:`. Ni l'un ni l'autre ne casse quoi que ce soit :
      # le site continue de se construire et de s'afficher, la faute ne se
      # voit que dans le texte publié.
      - name: Aucune adresse personnelle ni faux numéro ARTCI
        run: npm run verifier:mentions

      # Le cas nommé par la tâche 6 : une route ajoutée à App.tsx sans sa
      # règle dans netlify.toml passait `npm test`, `test:scripts` et
      # `build` — CI vert — pour rendre 404 en production sur une mention
      # légale. `verifier-routes.mjs` existait déjà pour l'arrêter, mais
      # seulement contre des dépôts jetables : rien n'exécutait la
      # comparaison contre les deux vrais fichiers avant la fusion. Cette
      # étape, et le témoin ajouté à `verifier-routes.test.mjs` qui joue la
      # même comparaison dans `test:scripts`, ferment ce trou des deux côtés.
      - name: App.tsx et netlify.toml dispatchent les mêmes routes
        run: npm run verifier:routes

      # La preuve qu'on enregistre avec chaque acceptation est une empreinte du
      # texte rendu. Si quelqu'un corrige une virgule des conditions sans
      # relancer le générateur, la constante désigne un instantané qui n'est
      # plus le texte affiché : on enregistrerait une acceptation pour un
      # document qu'on ne peut pas produire. Rien ne casse — le site se
      # construit, la page s'affiche, le formulaire répond — et c'est
      # précisément pourquoi seule une étape de CI l'attrape.
      - name: La version des conditions correspond au texte
        run: npm run verifier:cgu

      # `oxlint` était installé dans les trois applications et câblé à un script
      # `lint` depuis le début. Personne ne le lançait — ni cette vérification,
      # ni `npm run verifier`. Il signalait pourtant, depuis des jours, que
      # `gardeEnv` était importé sans être posé dans le `vite.config.ts` du
      # collecteur : le garde-fou qui refuse une clé de service dans un paquet
      # public ne gardait plus l'application du terrain.
      #
      # Ce qui rend cette étape utile et non décorative : `no-unused-vars` est
      # passé de « warn » à « error » dans les trois `.oxlintrc.json`. `oxlint`
      # sort à **zéro** sur un avertissement — câbler la commande sans cette
      # escalade aurait laissé passer exactement le défaut qui l'a motivée.
      # Mesuré : défaut réintroduit, `exit=1`.
      #
      # `react/only-export-components` reste délibérément en « warn ». C'est un
      # conseil de confort de développement, pas une règle de correction, et le
      # promouvoir bloquerait la construction sur deux fichiers que personne
      # n'a demandé de réécrire.
      #
      # `verifier:lint` et non `npm run lint --workspaces` : ce dernier ne
      # touche que `apps/*`, les seuls espaces de travail à déclarer un script
      # `lint`. `packages/core`, `packages/ui` et `scripts/` — 77 fichiers, dont
      # les composants partagés par les trois applications et les garde-fous
      # eux-mêmes — passaient donc à travers, avec `--if-present` qui les saute
      # en silence. Mesuré : un import mort dans `packages/ui` ne faisait rien
      # échouer.
      - name: Linter
        run: npm run verifier:lint

      - name: Tests des applications
        run: npm test

      - name: Tests des scripts
        run: npm run test:scripts

      - name: Construction
        run: npm run build

      # Le contrôle qui aurait vu passer la clé du 2026-08-24. Il inspecte les
      # trois `dist` et refuse de conclure si l'un manque.
      - name: Aucune clé de service dans les artefacts
        run: npm run verifier:bundles

  base:
    name: Base — RLS, journal, isolation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase start` applique les migrations au premier démarrage. Tous les
      # tests de `supabase/tests/` tournent donc contre le schéma du commit, y
      # compris les garde-fous qui échouent à la migration — dont celui qui
      # vérifie que les six triggers de journal couvrent bien les trois
      # événements.
      #
      # Le coureur GitHub a assez de mémoire pour la pile entière : les
      # exclusions nécessaires sur un poste à 4 Go de Docker n'ont pas lieu
      # d'être ici.
      - name: Pile Supabase
        run: supabase start

      - name: Tests de base
        run: npm run test:db

      # Le journal de la fonction est plus utile que sa sortie quand la pile
      # refuse de monter.
      - name: État de la pile en cas d'échec
        if: failure()
        run: supabase status || true

  fonctions:
    name: Déploiement — Edge Functions
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    # Ne déployer que ce qui a passé les deux vérifications. C'est tout
    # l'intérêt d'avoir un CI : la production ne reçoit rien qu'un test n'ait
    # regardé.
    needs: [depot, base]

    # Lire les runs du dépôt : la plage part du dernier run vert de `main`, que
    # seule l'API de GitHub connaît. `contents: read` reste pour le checkout :
    # nommer une permission retire toutes les autres.
    permissions:
      contents: read
      actions: read

    # Groupe **distinct** de celui du fichier, et sans annulation. La règle du
    # haut annule une exécution en cours quand une nouvelle poussée arrive —
    # excellent pour des tests, désastreux au milieu d'un déploiement, qui
    # laisserait la moitié des fonctions dans une version et l'autre dans la
    # suivante.
    concurrency:
      group: deploiement-fonctions
      cancel-in-progress: false

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # La référence n'est pas un secret : elle est déjà en clair dans la CSP
      # des trois netlify.toml. La mettre en secret donnerait l'illusion de
      # protéger quelque chose, et ferait échouer le job en silence le jour où
      # quelqu'un oublie de la poser.
      PROJET: yfnwmokxkznejotgpfgf

    steps:
      - uses: actions/checkout@v4
        with:
          # Historique entier : la plage à comparer est celle de la poussée, et
          # elle peut porter dix-sept commits. `fetch-depth: 2` suffisait à
          # comparer au parent — c'était justement l'erreur.
          fetch-depth: 0

      # ## Ce que ce contrôle a laissé passer le 2026-09-09
      #
      # Il comparait `HEAD~1 HEAD` : le dernier commit, et lui seul. Une branche
      # fusionnée en avance rapide a poussé dix-sept commits d'un coup, dont
      # deux touchaient `supabase/functions`. Le dernier ne touchait que
      # `Docs/`, donc le contrôle a conclu « aucune Edge Function touchée » et
      # le job a rendu « succès » sans rien déployer.
      #
      # Le symptôme est le pire de sa catégorie : un correctif de sécurité relu,
      # testé, fusionné, et jamais mis en ligne — avec un CI vert pour le dire.
      #
      # ## Le repli déploie, il ne saute pas
      #
      # Quand la plage ne peut pas être calculée — première poussée sur la
      # branche, historique tronqué, déclenchement manuel — on déploie. Les deux
      # erreurs possibles ne coûtent pas la même chose : redéployer pour rien
      # remplace du code par le même code, tandis que sauter un déploiement
      # laisse la production en arrière **sans que rien ne le dise**. C'est
      # exactement ce qui s'est produit.
      #
      # ## Et ce qu'il laissait encore passer, le 2026-10-02
      #
      # Il comparait toute la poussée, mais depuis la poussée précédente
      # (`github.event.before`). Quand le run de celle-ci avait été annulé, la
      # #18 et la #19 fusionnées à deux minutes d'écart, ce qu'elle apportait
      # n'entrait dans aucune plage. La base est désormais le dernier run vert de
      # `main` : un run annulé, remplacé ou rouge ne la fait pas avancer, et la
      # plage suivante reprend ce qu'il n'a pas fait. Le calcul vit dans
      # `scripts/plage-depuis-le-dernier-vert.mjs`, éprouvé, et ce job est gardé
      # par `scripts/workflow-verification.test.mjs`.
      - name: Y a-t-il quelque chose à déployer ?
        id: portee
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Déclenchement manuel : on déploie."
            echo "touche=oui" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Une API muette rend une base vide : le script couvre alors tout.
          depuis=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/verification.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null) || depuis=""
          node scripts/plage-depuis-le-dernier-vert.mjs --chemin supabase/functions --depuis "$depuis" --jusqua "${{ github.sha }}"

      # Un échec, et non plus un avertissement, depuis le 2026-10-02. Un run vert
      # fait avancer la base de la plage : un déploiement sauté en vert sortirait
      # ses fonctions de toute plage future, et personne ne les redéploierait. En
      # rouge, le run suivant les reprend.
      - name: Le jeton est-il posé ?
        id: jeton
        if: steps.portee.outputs.touche == 'oui'
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error title=Déploiement impossible::SUPABASE_ACCESS_TOKEN n'est pas posé dans les secrets du dépôt. Les fonctions modifiées ne sont pas déployées : poser le jeton, puis relancer ce run."
            exit 1
          fi
          echo "pret=oui" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        if: steps.jeton.outputs.pret == 'oui'
        with:
          version: latest

      # Présence n'est pas validité.
      #
      # Le 2026-09-03, ce job s'est exécuté pour la première fois — aucune
      # poussée n'avait touché `supabase/functions` depuis qu'il existe, et les
      # « ✓ en 7 secondes » des runs précédents ne déployaient rien. Le jeton,
      # posé quatre jours plus tôt, était refusé. L'étape ci-dessus l'avait
      # pourtant déclaré prêt : elle ne teste que la présence d'une chaîne.
      #
      # Le déploiement échouait alors sur « unexpected list functions status
      # 401 », après le regroupement des treize fonctions d'alors, sans dire
      # quoi faire.
      # Un appel qui ne coûte rien tranche la question plus tôt et la nomme.
      - name: Le jeton est-il accepté ?
        if: steps.jeton.outputs.pret == 'oui'
        run: |
          if ! sortie=$(supabase projects list 2>&1); then
            echo "$sortie"
            echo "::error title=Jeton Supabase refusé::SUPABASE_ACCESS_TOKEN est posé mais Supabase le refuse. Régénérer un jeton personnel — il commence par « sbp_ » — sur https://supabase.com/dashboard/account/tokens, puis « gh secret set SUPABASE_ACCESS_TOKEN ». D'ici là, les fonctions modifiées restent à déployer à la main."
            exit 1
          fi

      # **Toutes** les fonctions, pas seulement celles dont le fichier a changé.
      #
      # Le regroupement se fait au déploiement : chaque fonction embarque une
      # copie des modules de `_shared/` qu'elle importe. Une correction dans
      # `cors.ts` ou `plancher.ts` ne parvient donc à une fonction que si
      # **cette fonction** est redéployée. Ne pousser que le fichier modifié
      # laisserait en ligne toutes les copies de l'ancien module partagé sauf
      # une — et le symptôme serait une correction de sécurité appliquée à une
      # seule fonction, ce qui ne se voit d'aucune manière.
      #
      # Redéployer l'ensemble coûte quelques minutes. Le raisonnement pour
      # n'en faire que deux coûterait un jour de recherche le jour où il est
      # faux.
      - name: Déployer
        if: steps.jeton.outputs.pret == 'oui'
        run: supabase functions deploy --project-ref "$PROJET"

  rappel-migrations:
    name: Rappel — les migrations ne partent pas toutes seules
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [depot, base]

    # Mêmes droits que le job `fonctions`, pour la même raison : la plage part du
    # dernier run vert de `main`.
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Historique entier, comme pour les fonctions : le dernier run vert
          # peut être à plusieurs poussées d'ici. `fetch-depth: 2` et `HEAD~1` ne
          # voyaient que le dernier commit, le défaut du 2026-09-09, resté ici
          # jusqu'au 2026-10-02.
          fetch-depth: 0

      # Les migrations restent manuelles : `supabase db push` demande le mot de
      # passe de la base, que Supabase n'affiche qu'à la création du projet. Le
      # poser en secret supposerait de le réinitialiser — un geste qui casse
      # temporairement les `db push` locaux, et qui ne se fait pas au détour
      # d'un fichier de CI.
      #
      # Un `::notice` plutôt qu'un échec. Bloquer une poussée pour un rappel
      # serait vite contourné, et un garde-fou contourné ne garde plus rien.
      - name: Quelles migrations depuis le dernier run vert ?
        id: plage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          depuis=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/verification.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null) || depuis=""
          node scripts/plage-depuis-le-dernier-vert.mjs --chemin supabase/migrations --depuis "$depuis" --jusqua "${{ github.sha }}"

      - name: Signaler les migrations modifiées
        if: steps.plage.outputs.touche == 'oui'
        run: |
          if [ "${{ steps.plage.outputs.certaine }}" = "oui" ]; then
            echo "::notice title=À appliquer à la main::Des migrations ont changé depuis le dernier run vert. Lancer « npx supabase db push », puis vérifier avec « npx supabase migration list --linked »."
          else
            echo "::notice title=À vérifier à la main::La plage depuis le dernier run vert est inconnue. Vérifier avec « npx supabase migration list --linked » qu'aucune migration n'attend."
          fi
